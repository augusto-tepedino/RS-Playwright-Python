name: Playwright Tests CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Run Playwright Tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      APP_USER_EMAIL: ${{ secrets.APP_USER_EMAIL || 'rahulshetty@gmail.com' }}
      APP_USER_PASSWORD: ${{ secrets.APP_USER_PASSWORD || 'Iamking@000' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium & system dependencies
        run: |
          playwright install --with-deps chromium

      - name: Run Playwright Test
        run: |
          python -m pytest PytestPython/playwright/test_framework_web_api.py \
            -v -s \
            -c PytestPython/pytest.ini \
            --html=report.html --self-contained-html

      - name: Upload Test Report & Trace Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-artifacts
          path: |
            report.html
            trace.zip
          retention-days: 7
